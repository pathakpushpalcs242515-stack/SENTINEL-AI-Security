
services:
  # Backend API
  - type: web
    name: sentinel-ai-security-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 2 --threads 4 --timeout 120
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9

      - key: FRONTEND_ORIGIN
        value: "*"

  # Frontend Website
  - type: web
    name: sentinel-ai-security-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://sentinel-ai-security-817u.onrender.com
